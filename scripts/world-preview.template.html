<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Unova — world design</title>
<style>
:root { color-scheme: light dark; --font-size-base:14px; --viz-series-1:var(--chart-1); }
body { margin:0; color:var(--foreground); font-family:var(--font-sans, sans-serif); font-size:var(--font-size-base); }
#world-plan { width:100%; }
p { margin:0 0 14px; }
h2,h3 { font-weight:500; margin:0 0 12px; }
.muted { color:var(--muted-foreground); }
.counts { display:flex; flex-wrap:wrap; gap:8px 20px; margin:12px 0 18px; }
.counts span { white-space:nowrap; }
.network { position:relative; }
.edges { position:absolute; inset:0; pointer-events:none; overflow:visible; }
.edges path { fill:none; stroke:var(--border); stroke-width:1.5; }
.regions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:34px 28px; position:relative; }
.region { min-width:0; }
.region h3 { color:var(--muted-foreground); }
.towns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 18px; }
.btn { appearance:none; border:1px solid var(--border); background:var(--background); color:var(--foreground); border-radius:var(--radius,6px); padding:10px 8px; font:inherit; min-height:44px; overflow-wrap:anywhere; }
.btn:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }
.btn[aria-pressed="true"] { background:var(--primary); color:var(--primary-foreground); }
.gym { border-bottom:3px solid var(--chart-1); }
.base { position:relative; display:block; text-align:center; margin:0 auto 30px; max-width:300px; padding:12px 16px; background:var(--secondary); color:var(--secondary-foreground); border-radius:var(--radius,6px); }
.detail { margin-top:24px; padding:16px; border-radius:var(--radius,6px); background:var(--card); color:var(--card-foreground); }
.detail p:last-child { margin-bottom:0; }
.detail strong { font-weight:500; }
.secret-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 20px; padding-left:18px; margin-bottom:0; }
.legend { margin:18px 0 0; display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted-foreground); }
.legend i { display:inline-block; width:20px; border-bottom:3px solid var(--chart-1); margin-right:6px; }
.legend em { display:inline-block; width:20px; border-bottom:1.5px solid var(--border); margin-right:6px; }
@media(max-width:520px) { .regions { grid-template-columns:1fr; gap:30px; } .secret-list { grid-template-columns:1fr; } }
</style>
</head>
<body>
<section id="world-plan" aria-label="Hidden Unova proposed world connections">
  <p class="muted">World design draft · everything before the final Champion · no playable ROM yet</p>
  <h2>A larger Unova, with N as Champion</h2>
  <div class="counts" id="counts"></div>
  <div class="network" id="network">
    <svg class="edges" id="edges" aria-hidden="true"></svg>
    <div class="base" id="base">Original Unova · eight original Gyms</div>
    <div class="regions" id="regions"></div>
  </div>
  <div class="legend"><span><i></i>New Gym town</span><span><em></em>Proposed travel connection</span><span>Concept layout, not in-game geography</span></div>
  <div class="detail" id="detail" aria-live="polite"></div>
</section>
<script id="world-data" type="application/json">__DATA__</script>
<script>
(() => {
  const root = document.getElementById('world-plan');
  const data = JSON.parse(document.getElementById('world-data').textContent);
  const byId = new Map(data.towns.map(t => [t.id,t]));
  const nodeElements = new Map();
  const regions = root.querySelector('#regions');
  const counts = root.querySelector('#counts');
  for (const text of [data.towns.length+' new towns',data.gyms.length+' extra Gyms',data.secretCount+' secret places','649 species target']) {
    const span = document.createElement('span'); span.textContent=text; counts.append(span);
  }
  function select(id, save) {
    const town = byId.get(id); if (!town) return;
    for (const [key,button] of nodeElements) button.setAttribute('aria-pressed',String(key===id));
    const detail=root.querySelector('#detail'); detail.replaceChildren();
    const title=document.createElement('h3'); title.textContent=town.name; detail.append(title);
    const gym=data.gyms.find(g=>g.townId===id);
    const line=document.createElement('p'); line.textContent=gym ? gym.name+' · '+gym.type+' · Leader '+gym.leader : 'Exploration town · clues, routes, and side stories'; detail.append(line);
    if (gym && gym.puzzle) { const p=document.createElement('p'); p.textContent=gym.puzzle; detail.append(p); }
    const list=document.createElement('ul'); list.className='secret-list';
    for (const secret of town.secrets) { const li=document.createElement('li'); li.textContent=secret.name+' — '+secret.species; list.append(li); }
    detail.append(list);
    if (save && window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{selectedTown:id},privateContent:null}).catch(()=>{});
  }
  for (const region of data.regions) {
    const section=document.createElement('section'); section.className='region';
    const h=document.createElement('h3'); h.textContent=region.name; section.append(h);
    const group=document.createElement('div'); group.className='towns';
    for (const id of region.townIds) {
      const town=byId.get(id); if (!town) continue;
      const button=document.createElement('button'); button.type='button'; button.className='btn';
      if (data.gyms.some(g=>g.townId===id)) button.classList.add('gym');
      button.textContent=town.name; button.setAttribute('aria-pressed','false');
      button.setAttribute('aria-label',town.name+', show Gym and hidden places');
      button.addEventListener('click',()=>select(id,true)); nodeElements.set(id,button); group.append(button);
    }
    section.append(group); regions.append(section);
  }
  function drawEdges() {
    const network=root.querySelector('#network'); const bounds=network.getBoundingClientRect();
    const svg=root.querySelector('#edges'); svg.setAttribute('width',String(bounds.width)); svg.setAttribute('height',String(bounds.height)); svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`); svg.replaceChildren();
    const point=id=> { const el=nodeElements.get(id)||root.querySelector('#base'); const r=el.getBoundingClientRect(); return [r.x-bounds.x+r.width/2,r.y-bounds.y+r.height/2]; };
    for (const route of data.routes) {
      const [x1,y1]=point(route.from); const [x2,y2]=point(route.to);
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`); svg.append(path);
    }
  }
  const first=window.openai?.widgetState?.modelContent?.selectedTown;
  select(byId.has(first)?first:data.towns[0].id,false);
  new ResizeObserver(drawEdges).observe(root.querySelector('#network'));
  window.addEventListener('openai:set_globals',e=>{ const id=e.detail?.globals?.widgetState?.modelContent?.selectedTown; if(byId.has(id)) select(id,false); });
  requestAnimationFrame(drawEdges);
  console.log('World preview ready',JSON.stringify({towns:data.towns.length,gyms:data.gyms.length,secrets:data.secretCount,routes:data.routes.length}));
})();
</script>
</body>
</html>
